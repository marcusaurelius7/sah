# De câteva ori pe zi: trage partidele noi de pe Chess.com și publică pagina pe GitHub Pages.
name: Actualizează scorul

on:
  schedule:
    - cron: "17 */3 * * *"   # la fiecare 3 ore
  push:
    branches: [main]
  workflow_dispatch:         # buton „Run workflow” pentru o actualizare imediată

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/fetch.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
